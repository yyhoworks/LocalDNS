name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Build, typecheck, test, lint and verify the generated UI
        run: npm run --prefix frontend check

  tools-tests:
    name: Tools Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Each test_*.py is a self-contained stdlib unittest module and
      # is run the same way docs/DEVELOPMENT.md documents locally.
      # tools/test_proxy_config_installer.py is intentionally not listed: it
      # exercises the packaged ProxyConfig service archive under
      # dist/<releaseTag>/, which only exists after a release build.
      - name: Run tools tests
        run: |
          set -e
          for test_file in \
            tools/test_fjgli_upgrade.py \
            tools/test_core_upload.py \
            tools/test_online_updater.py \
            tools/test_oneclick_installer.py \
            tools/test_package_ui.py \
            tools/test_shared_ui.py \
            tools/test_ui_updater.py \
            services/mihomo-return-guard/test_guard.py; do
            echo "== $test_file"
            python3 "$test_file"
          done

  proxy-config-tests:
    name: Proxy-config Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/proxy-config/go.mod
      - name: Run Go tests
        working-directory: services/proxy-config
        run: go test ./...
